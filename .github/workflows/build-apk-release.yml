name: Build APK release

# Builds the FOSS release APK and attaches it to a GitHub Release.
#
# Runs manually (workflow_dispatch) or when a "v*" tag is pushed.
#
# Signing: set the repository secrets below to sign with your own key so that
# every release can be installed as an update over the previous one.
#   SIGNING_KEYSTORE_BASE64  base64 of the .jks keystore
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD
#   SIGNING_STORE_PASSWORD
# Without them a throwaway key is generated for the run: the APK installs fine,
# but a later release signed with another throwaway key requires uninstalling
# the previous one first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<VERSION_NAME> from gradle.properties)"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION_NAME="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          VERSION_CODE="$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v${VERSION_NAME}"
          fi
          {
            echo "tag=${TAG}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          STORE_FILE="${RUNNER_TEMP}/release.jks"
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ] && [ -n "${STORE_PASSWORD}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${STORE_FILE}"
            echo "mode=repository key" >> "$GITHUB_OUTPUT"
          else
            KEY_ALIAS="ci"
            KEY_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
            STORE_PASSWORD="${KEY_PASSWORD}"
            keytool -genkeypair -v \
              -keystore "${STORE_FILE}" -storetype PKCS12 \
              -alias "${KEY_ALIAS}" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${STORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
              -dname "CN=CI build, O=Calendar, C=IT"
            echo "::add-mask::${KEY_PASSWORD}"
            echo "mode=throwaway key generated by this run" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "SIGNING_STORE_FILE=${STORE_FILE}"
            echo "SIGNING_KEY_ALIAS=${KEY_ALIAS}"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD}"
            echo "SIGNING_STORE_PASSWORD=${STORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build FOSS release APK
        run: ./gradlew assembleFossRelease --no-daemon

      - name: Collect APK
        id: apk
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          SRC="$(find app/build/outputs/apk/foss/release -name '*.apk' | head -n 1)"
          test -n "${SRC}"
          DEST="calendar-${TAG}-foss.apk"
          cp "${SRC}" "${DEST}"
          sha256sum "${DEST}" > "${DEST}.sha256"
          echo "file=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          body: |
            FOSS release APK, version ${{ steps.meta.outputs.version_name }} (versionCode ${{ steps.meta.outputs.version_code }}).
            Built from commit ${{ github.sha }}.
            Signing: ${{ steps.signing.outputs.mode }}.
